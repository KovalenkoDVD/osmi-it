[project]
name = "osmi-rag-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "anthropic>=2.10.0",
    "asyncpg>=0.32.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "openai>=3.53.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2",
    "pypdf>=7.1.0",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings/comments is intended

[tool.pytest.ini_options]
testpaths = ["tests"]
